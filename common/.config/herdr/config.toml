onboarding = false

[terminal]
default_shell = "/opt/homebrew/bin/zsh"
shell_mode = "login"

[theme]
name = "rose-pine"
auto_switch = false

[theme.custom]
panel_bg = "reset"

[update]
channel = "stable"
version_check = true

[keys]
prefix = "ctrl+s"
help = "prefix+?"
settings = "prefix+s"
detach = "prefix+d"
reload_config = "prefix+shift+r"
open_notification_target = "prefix+o"
workspace_picker = "prefix+w"
goto = "prefix+g"
new_workspace = "prefix+ctrl+c"
open_worktree = "prefix+ctrl+g"
rename_workspace = "prefix+ctrl+r"
previous_workspace = "prefix+ctrl+["
next_workspace = "prefix+ctrl+]"
close_workspace = "prefix+ctrl+x"
remote_image_paste = "ctrl+v"
new_tab = "prefix+c"
rename_tab = "prefix+r"
previous_tab = "prefix+["
next_tab = "prefix+]"
switch_tab = "prefix+1..9"
switch_workspace = "prefix+ctrl+1..9"
close_tab = "prefix+x"
rename_pane = "prefix+shift+p"
edit_scrollback = "prefix+e"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"
split_vertical = "prefix+shift+v"
split_horizontal = "prefix+shift+h"
close_pane = "prefix+shift+x"
zoom = "prefix+z"
toggle_sidebar = "prefix+b"
navigate_workspace_up = "up"
navigate_workspace_down = "down"
navigate_pane_left = "h"
navigate_pane_down = "j"
navigate_pane_up = "k"
navigate_pane_right = "l"

# Keymap conventions (run `herdr config check` after changes):
#   prefix+<k>       current tab/pane, most frequent actions
#   prefix+ctrl+<k>  workspace/worktree scope
#   prefix+shift+<k> bigger/destructive variant of the plain key
#   plugins: one home letter each, variants on shift/ctrl of that letter
#   avoid: prefix+ctrl+s (prefix itself), ctrl+i/m/[/h (tab/enter/esc/backspace)

# Worktrunk (g): worktrees
[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "worktrunk.open"
description = "Worktree: switch / create"

[[keys.command]]
key = "prefix+shift+d"
type = "plugin_action"
command = "worktrunk.remove"
description = "Worktree: remove"

# herdr-nvim (n)
[[keys.command]]
key = "prefix+n"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+shift+n"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

# Annotate (a, m): terminal annotations
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate text"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "copy annotations as context"

[[keys.command]]
key = "prefix+ctrl+a"
type = "plugin_action"
command = "annotate.copy-archive"
description = "copy annotations as context and archive them"

[[keys.command]]
key = "prefix+ctrl+v"
type = "plugin_action"
command = "annotate.paste-archive"
description = "paste annotations into the agent's prompt and archive them"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "manage annotations"

[[keys.command]]
key = "prefix+shift+m"
type = "plugin_action"
command = "annotate.send-archive"
description = "send annotations to the agent and archive them"

# Annotate review via plannotator (f)
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "annotate.open"
description = "review documents in this folder"

[[keys.command]]
key = "prefix+shift+f"
type = "plugin_action"
command = "annotate.last"
description = "review the agent's last reply"

[[keys.command]]
key = "prefix+ctrl+f"
type = "plugin_action"
command = "annotate.last-newest"
description = "review the agent's newest reply"

# Plugin manager (p)
[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "ray.plugin-manager.open"
description = "open plugin manager"

[ui]
sidebar_collapsed_mode = "compact"
prompt_new_tab_name = true
pane_borders = true
confirm_close = true
pane_gaps = true
show_agent_labels_on_pane_borders = true
sidebar_start_collapsed = true

agent_panel_sort = "priority"
[ui.toast]
delivery = "terminal"

[ui.toast.herdr]
position = "bottom-right"

[ui.toast.clipboard]
enabled = true
position = "bottom-center"

[ui.sound]
enabled = true

[remote]
manage_ssh_config = true

[experimental]
kitty_graphics = true
pane_history = true
