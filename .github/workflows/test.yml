name: Test Dotfiles

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  syntax-validation:
    name: Syntax Validation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install validation tools (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck yamllint taplo serkanyersen/dotstate/dotstate

      - name: Install validation tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck zsh yamllint

          # Install the pinned dotstate release the same way install.sh does
          bash -c 'source ./install.sh; OS=linux; install_dotstate'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          # Install taplo for TOML validation
          curl -fsSL https://github.com/tamasfe/taplo/releases/latest/download/taplo-linux-x86_64.gz | gunzip -c > /tmp/taplo
          sudo install -m 755 /tmp/taplo /usr/local/bin/taplo

      - name: Run syntax validation
        run: |
          chmod +x ./test.sh
          ./test.sh

  test-macos:
    name: Test on macOS
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run install script
        run: |
          # Run install script in non-interactive mode with --no-gui
          bash install.sh --no-gui
        env:
          CI: true
          NONINTERACTIVE: 1

      - name: Verify dotstate links
        run: |
          missing=0
          for file in .zshrc .zshenv .zprofile .gitconfig AGENTS.md; do
            if [ "$(readlink ~/$file)" = "$GITHUB_WORKSPACE/common/$file" ]; then
              echo "✓ ~/$file -> $(readlink ~/$file)"
            else
              echo "✗ ~/$file does not link to common/$file"
              ls -la ~/$file 2>&1 || true
              missing=1
            fi
          done
          exit $missing

      - name: Verify dotstate health
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          if [ -d "/opt/homebrew" ]; then
            eval "$(/opt/homebrew/bin/brew shellenv)"
          fi
          dotstate doctor --no-colors

      - name: Verify Homebrew environment
        run: |
          if [ -d "/opt/homebrew" ]; then
            eval "$(/opt/homebrew/bin/brew shellenv)"
          else
            eval "$(/usr/local/bin/brew shellenv)"
          fi
          echo "Homebrew prefix: $(brew --prefix)"
          echo "PATH: $PATH"

      - name: Verify zsh configuration loads
        run: |
          # Source Homebrew environment first
          if [ -d "/opt/homebrew" ]; then
            eval "$(/opt/homebrew/bin/brew shellenv)"
          else
            eval "$(/usr/local/bin/brew shellenv)"
          fi

          # Try to load zsh config
          if [ -f ~/.zshrc ]; then
            zsh -c "source ~/.zshenv; source ~/.zshrc" && echo "zsh config loaded successfully"
          else
            echo "~/.zshrc not found"
            exit 1
          fi

      - name: Verify git configuration
        run: |
          if [ -L ~/.gitconfig ]; then
            echo "✓ .gitconfig is a symlink"
          else
            echo "✗ .gitconfig is not a symlink"
            ls -la ~/.gitconfig || echo "✗ .gitconfig does not exist"
            exit 1
          fi

          echo "Git aliases:"
          git config --list | grep "^alias\." | head -5 || echo "No git aliases found"

          if git config --list | grep -q "alias\.d=diff"; then
            echo "✓ git alias 'd' configured correctly"
          else
            echo "✗ git alias 'd' not found"
            exit 1
          fi

      - name: Verify tmux configuration exists
        run: |
          if [ -d "/opt/homebrew" ]; then
            eval "$(/opt/homebrew/bin/brew shellenv)"
          else
            eval "$(/usr/local/bin/brew shellenv)"
          fi

          if [ -L ~/.config/tmux ]; then
            echo "✓ .config/tmux is a symlink"
            ls -la ~/.config/tmux/tmux.conf || echo "tmux.conf not found"
          else
            echo "Note: .config/tmux may not be symlinked yet"
          fi

      - name: List installed tools
        run: |
          if [ -d "/opt/homebrew" ]; then
            eval "$(/opt/homebrew/bin/brew shellenv)"
          else
            eval "$(/usr/local/bin/brew shellenv)"
          fi

          echo "=== Installed CLI Tools ==="
          for cmd in zsh git dotstate fzf rg fd bat eza starship gh yazi; do
            if command -v $cmd >/dev/null 2>&1; then
              version=$($cmd --version 2>&1 | head -1 || echo "version unknown")
              echo "✓ $cmd: $version"
            else
              echo "✗ $cmd: not installed"
            fi
          done

  test-ubuntu:
    name: Test on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run install script
        run: |
          # Run install script in non-interactive mode with --no-gui
          bash install.sh --no-gui
        env:
          CI: true
          NONINTERACTIVE: 1

      - name: Verify dotstate links
        run: |
          missing=0
          for file in .zshrc .zshenv .zprofile .gitconfig AGENTS.md; do
            if [ "$(readlink ~/$file)" = "$GITHUB_WORKSPACE/common/$file" ]; then
              echo "✓ ~/$file -> $(readlink ~/$file)"
            else
              echo "✗ ~/$file does not link to common/$file"
              ls -la ~/$file 2>&1 || true
              missing=1
            fi
          done
          exit $missing

      - name: Verify dotstate health
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          if [ -d "/opt/homebrew" ]; then
            eval "$(/opt/homebrew/bin/brew shellenv)"
          fi
          dotstate doctor --no-colors

      - name: Verify Homebrew environment
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          echo "Homebrew prefix: $(brew --prefix)"
          echo "PATH: $PATH"

      - name: Verify zsh configuration loads
        run: |
          # Source Homebrew environment first
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"

          # Try to load zsh config
          if [ -f ~/.zshrc ]; then
            zsh -c "source ~/.zshenv; source ~/.zshrc" && echo "zsh config loaded successfully"
          else
            echo "~/.zshrc not found"
            exit 1
          fi

      - name: Verify git configuration
        run: |
          if [ -L ~/.gitconfig ]; then
            echo "✓ .gitconfig is a symlink"
          else
            echo "✗ .gitconfig is not a symlink"
            ls -la ~/.gitconfig || echo "✗ .gitconfig does not exist"
            exit 1
          fi

          echo "Git aliases:"
          git config --list | grep "^alias\." | head -5 || echo "No git aliases found"

          if git config --list | grep -q "alias\.d=diff"; then
            echo "✓ git alias 'd' configured correctly"
          else
            echo "✗ git alias 'd' not found"
            exit 1
          fi

      - name: List installed tools
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"

          echo "=== Installed CLI Tools ==="
          for cmd in zsh git dotstate fzf rg fd bat eza starship gh yazi; do
            if command -v $cmd >/dev/null 2>&1; then
              version=$($cmd --version 2>&1 | head -1 || echo "version unknown")
              echo "✓ $cmd: $version"
            else
              echo "✗ $cmd: not installed"
            fi
          done

  test-codespaces:
    name: Test Codespaces bootstrap
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run Codespaces install
        run: bash install.sh --no-gui
        env:
          CI: true
          CODESPACES: true
          NONINTERACTIVE: 1

      - name: Verify Codespaces install is idempotent
        run: bash install.sh --no-gui
        env:
          CI: true
          CODESPACES: true
          NONINTERACTIVE: 1
