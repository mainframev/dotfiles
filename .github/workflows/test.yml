name: Test Dotfiles

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  syntax-validation:
    name: Syntax Validation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install validation tools (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck yamllint stow taplo

      - name: Install validation tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck zsh yamllint stow

          # Install taplo for TOML validation
          curl -fsSL https://github.com/tamasfe/taplo/releases/latest/download/taplo-linux-x86_64.gz | gunzip -c > /tmp/taplo
          sudo install -m 755 /tmp/taplo /usr/local/bin/taplo

      - name: Run syntax validation
        run: |
          chmod +x ./test.sh
          ./test.sh

  test-macos:
    name: Test on macOS
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run install script
        run: |
          # Run install script in non-interactive mode with --no-gui
          bash install.sh --no-gui
        env:
          CI: true
          NONINTERACTIVE: 1

      - name: Verify stow links
        run: |
          missing=0
          for file in .zshrc .zshenv .zprofile .gitconfig; do
            if [ -L ~/$file ]; then
              echo "✓ ~/$file -> $(readlink ~/$file)"
            else
              echo "✗ ~/$file is not a symlink"
              ls -la ~/$file 2>&1 || true
              missing=1
            fi
          done
          exit $missing

      - name: Verify Homebrew environment
        run: |
          if [ -d "/opt/homebrew" ]; then
            eval "$(/opt/homebrew/bin/brew shellenv)"
          else
            eval "$(/usr/local/bin/brew shellenv)"
          fi
          echo "Homebrew prefix: $(brew --prefix)"
          echo "PATH: $PATH"

      - name: Verify zsh configuration loads
        run: |
          # Source Homebrew environment first
          if [ -d "/opt/homebrew" ]; then
            eval "$(/opt/homebrew/bin/brew shellenv)"
          else
            eval "$(/usr/local/bin/brew shellenv)"
          fi

          # Try to load zsh config
          if [ -f ~/.zshrc ]; then
            zsh -c "source ~/.zshenv; source ~/.zshrc" && echo "zsh config loaded successfully"
          else
            echo "~/.zshrc not found"
            exit 1
          fi

      - name: Verify git configuration
        run: |
          if [ -L ~/.gitconfig ]; then
            echo "✓ .gitconfig is a symlink"
          else
            echo "✗ .gitconfig is not a symlink"
            ls -la ~/.gitconfig || echo "✗ .gitconfig does not exist"
            exit 1
          fi

          echo "Git aliases:"
          git config --list | grep "^alias\." | head -5 || echo "No git aliases found"

          if git config --list | grep -q "alias\.d=diff"; then
            echo "✓ git alias 'd' configured correctly"
          else
            echo "✗ git alias 'd' not found"
            exit 1
          fi

      - name: Verify tmux configuration exists
        run: |
          if [ -d "/opt/homebrew" ]; then
            eval "$(/opt/homebrew/bin/brew shellenv)"
          else
            eval "$(/usr/local/bin/brew shellenv)"
          fi

          if [ -L ~/.config/tmux ]; then
            echo "✓ .config/tmux is a symlink"
            ls -la ~/.config/tmux/tmux.conf || echo "tmux.conf not found"
          else
            echo "Note: .config/tmux may not be symlinked yet"
          fi

      - name: List installed tools
        run: |
          if [ -d "/opt/homebrew" ]; then
            eval "$(/opt/homebrew/bin/brew shellenv)"
          else
            eval "$(/usr/local/bin/brew shellenv)"
          fi

          echo "=== Installed CLI Tools ==="
          for cmd in zsh git stow fzf rg fd bat eza starship gh yazi; do
            if command -v $cmd >/dev/null 2>&1; then
              version=$($cmd --version 2>&1 | head -1 || echo "version unknown")
              echo "✓ $cmd: $version"
            else
              echo "✗ $cmd: not installed"
            fi
          done

  test-ubuntu:
    name: Test on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run install script
        run: |
          # Run install script in non-interactive mode with --no-gui
          bash install.sh --no-gui
        env:
          CI: true
          NONINTERACTIVE: 1

      - name: Verify stow links
        run: |
          missing=0
          for file in .zshrc .zshenv .zprofile .gitconfig; do
            if [ -L ~/$file ]; then
              echo "✓ ~/$file -> $(readlink ~/$file)"
            else
              echo "✗ ~/$file is not a symlink"
              ls -la ~/$file 2>&1 || true
              missing=1
            fi
          done
          exit $missing

      - name: Verify Homebrew environment
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          echo "Homebrew prefix: $(brew --prefix)"
          echo "PATH: $PATH"

      - name: Verify zsh configuration loads
        run: |
          # Source Homebrew environment first
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"

          # Try to load zsh config
          if [ -f ~/.zshrc ]; then
            zsh -c "source ~/.zshenv; source ~/.zshrc" && echo "zsh config loaded successfully"
          else
            echo "~/.zshrc not found"
            exit 1
          fi

      - name: Verify git configuration
        run: |
          if [ -L ~/.gitconfig ]; then
            echo "✓ .gitconfig is a symlink"
          else
            echo "✗ .gitconfig is not a symlink"
            ls -la ~/.gitconfig || echo "✗ .gitconfig does not exist"
            exit 1
          fi

          echo "Git aliases:"
          git config --list | grep "^alias\." | head -5 || echo "No git aliases found"

          if git config --list | grep -q "alias\.d=diff"; then
            echo "✓ git alias 'd' configured correctly"
          else
            echo "✗ git alias 'd' not found"
            exit 1
          fi

      - name: List installed tools
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"

          echo "=== Installed CLI Tools ==="
          for cmd in zsh git stow fzf rg fd bat eza starship gh yazi; do
            if command -v $cmd >/dev/null 2>&1; then
              version=$($cmd --version 2>&1 | head -1 || echo "version unknown")
              echo "✓ $cmd: $version"
            else
              echo "✗ $cmd: not installed"
            fi
          done

  test-codespaces:
    name: Test Codespaces bootstrap
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run Codespaces install
        run: bash install.sh --no-gui
        env:
          CI: true
          CODESPACES: true
          NONINTERACTIVE: 1

      - name: Verify Codespaces install is idempotent
        run: bash install.sh --no-gui
        env:
          CI: true
          CODESPACES: true
          NONINTERACTIVE: 1

  test-stow-structure:
    name: Test Stow Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install stow
        run: sudo apt-get update && sudo apt-get install -y stow

      - name: Verify .stowrc exists
        run: |
          if [ -f .stowrc ]; then
            echo "✓ .stowrc found"
            cat .stowrc
          else
            echo "✗ .stowrc not found"
            exit 1
          fi

      - name: Verify .stow-local-ignore exists
        run: |
          if [ -f .stow-local-ignore ]; then
            echo "✓ .stow-local-ignore found"
            echo "Ignored patterns:"
            head -10 .stow-local-ignore
          else
            echo "✗ .stow-local-ignore not found"
            exit 1
          fi

      - name: Test stow dry-run into $HOME
        run: |
          # Use the repo as the stow dir explicitly; .stowrc is only read from the cwd
          stow -n -v --dir="$GITHUB_WORKSPACE" --target="$HOME" . 2>&1 | tee stow-output.log
          if grep -Eqi "conflict|cannot stow|not owned by stow" stow-output.log; then
            echo "✗ Stow conflicts detected"
            exit 1
          fi
          echo "✓ No stow conflicts detected"

      - name: Test actual stow
        run: |
          stow -v --dir="$GITHUB_WORKSPACE" --target="$HOME" .

          missing=0
          for path in .zshrc .zshenv .zprofile .gitconfig .config/zsh .config/nvim; do
            if [ -L ~/$path ] || [ -L "$(dirname ~/$path)" ]; then
              echo "✓ ~/$path linked"
            else
              echo "✗ ~/$path not linked"
              missing=1
            fi
          done
          exit $missing

      - name: Verify stow respects .stow-local-ignore
        run: |
          # These should NOT be symlinked
          if [ -L ~/.git ] || [ -e ~/.git ]; then
            echo "✗ .git was stowed (should be ignored)"
            exit 1
          else
            echo "✓ .git correctly ignored"
          fi

          if [ -L ~/README.md ] || [ -e ~/README.md ]; then
            echo "✗ README.md was stowed (should be ignored)"
            exit 1
          else
            echo "✓ README.md correctly ignored"
          fi
